services:
  mysql:
    image: mysql:8.0
    container_name: hrm-mysql
    environment:
      MYSQL_DATABASE: hrm_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - hrm_mysql_data:/var/lib/mysql

volumes:
  hrm_mysql_data: