<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | HRM">HRM</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="sidebar-brand" th:href="@{/dashboard}"><span class="brand-mark"><i class="bi bi-people-fill"></i></span><span>Northstar<span class="brand-subtitle">PEOPLE SYSTEM</span></span></a>
        <nav class="sidebar-nav" aria-label="Main navigation">
            <span class="nav-caption">WORKSPACE</span>
            <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')" th:href="@{/employees}"><i class="bi bi-person-vcard"></i> Employees</a>
            <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/catalog}"><i class="bi bi-collection"></i> Catalog</a>
            <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/attendance}"><i class="bi bi-clock-history"></i> Attendance</a>
            <a class="nav-link" sec:authorize="hasAnyRole('MANAGER','EMPLOYEE')" th:if="${#authentication.principal.employeeId != null}" th:href="@{/attendance}"><i class="bi bi-clock-history"></i> Attendance</a>
            <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/leaves}"><i class="bi bi-calendar2-check"></i> Leave</a>
            <a class="nav-link" sec:authorize="hasAnyRole('MANAGER','EMPLOYEE')" th:if="${#authentication.principal.employeeId != null}" th:href="@{/leaves}"><i class="bi bi-calendar2-check"></i> Leave</a>
            <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/payroll}"><i class="bi bi-cash-stack"></i> Payroll</a>
            <a class="nav-link" sec:authorize="hasAnyRole('MANAGER','EMPLOYEE')" th:href="@{/payroll/my}"><i class="bi bi-receipt"></i> Payslips</a>
            <span class="nav-caption mt-4">ACCOUNT</span>
            <a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle"></i> Profile</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"><i class="bi bi-sliders"></i> Administration</a>
        </nav>
        <div class="sidebar-foot">HRM <span>v1.0</span></div>
    </aside>
    <section class="workspace">
        <header class="topbar">
            <div class="topbar-kicker">HUMAN RESOURCES</div>
            <div class="account-area">
                <span class="account-avatar" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                <div class="account-name"><span th:text="${#authentication.name}">User</span><small sec:authentication="principal.authorities">ROLE</small></div>
                <form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-link signout-button" aria-label="Sign out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button></form>
            </div>
        </header>
        <div class="content-area">
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <main layout:fragment="content"></main>
        </div>
    </section>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
