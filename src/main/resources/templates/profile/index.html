<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Profile</title></head>
<body>
<main layout:fragment="content">
    <div class="page-heading"><div><p class="eyebrow">ACCOUNT</p><h1>Profile</h1><p class="text-secondary">Personal details and sign-in security.</p></div></div>
    <section class="form-surface mb-4" th:if="${employee != null}">
        <h2>Employee information</h2><dl class="detail-grid mb-4">
            <div><dt>Employee code</dt><dd th:text="${employee.code}"></dd></div><div><dt>Full name</dt><dd th:text="${employee.fullName}"></dd></div><div><dt>Email</dt><dd th:text="${employee.email}"></dd></div>
            <div><dt>Department</dt><dd th:text="${employee.department.name}"></dd></div><div><dt>Position</dt><dd th:text="${employee.position.name}"></dd></div><div><dt>Status</dt><dd th:text="${employee.status}"></dd></div>
        </dl>
        <form th:action="@{/profile}" th:object="${profileForm}" method="post" class="row g-3">
            <div class="col-md-5"><label class="form-label" for="phone">Phone</label><input id="phone" class="form-control" th:field="*{phone}" maxlength="20"></div>
            <div class="col-md-7"><label class="form-label" for="address">Address</label><input id="address" class="form-control" th:field="*{address}" maxlength="255"></div>
            <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Save profile</button></div>
        </form>
    </section>
    <section class="form-surface mb-4" th:if="${employee == null}"><h2>Employee information</h2><p class="text-secondary mb-0">This account is not linked to an employee record.</p></section>
    <section class="form-surface"><h2>Change password</h2>
        <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" class="row g-3">
            <div class="col-md-4"><label class="form-label" for="currentPassword">Current password *</label><input id="currentPassword" type="password" class="form-control" th:field="*{currentPassword}" autocomplete="current-password" required></div>
            <div class="col-md-4"><label class="form-label" for="newPassword">New password *</label><input id="newPassword" type="password" class="form-control" th:field="*{newPassword}" minlength="8" autocomplete="new-password" required></div>
            <div class="col-md-4"><label class="form-label" for="confirmPassword">Confirm new password *</label><input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}" minlength="8" autocomplete="new-password" required></div>
            <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Change password</button></div>
        </form>
    </section>
</main>
</body>
</html>
