<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head><title>Employees</title></head>
<body>
<main layout:fragment="content">
    <div class="page-heading">
        <div><p class="eyebrow">PEOPLE DIRECTORY</p><h1>Employees</h1><p class="text-secondary">Search and review employee records.</p></div>
        <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/employees/export(q=${q},department=${selectedDepartment},position=${selectedPosition},status=${selectedStatus})}"><i class="bi bi-file-earmark-excel me-1"></i> Export Excel</a><a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/employees/new}"><i class="bi bi-plus-lg me-1"></i> New employee</a></div>
    </div>
    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/employees}">
        <div class="col-lg-4"><label class="form-label" for="q">Search</label><input id="q" name="q" class="form-control" placeholder="Name, code, or email" th:value="${q}"></div>
        <div class="col-md-3 col-lg-2"><label class="form-label" for="department">Department</label><select id="department" name="department" class="form-select"><option value="">All</option><option th:each="item : ${departments}" th:value="${item.id}" th:text="${item.name}" th:selected="${selectedDepartment == item.id}"></option></select></div>
        <div class="col-md-3 col-lg-2"><label class="form-label" for="position">Position</label><select id="position" name="position" class="form-select"><option value="">All</option><option th:each="item : ${positions}" th:value="${item.id}" th:text="${item.name}" th:selected="${selectedPosition == item.id}"></option></select></div>
        <div class="col-md-3 col-lg-2"><label class="form-label" for="status">Status</label><select id="status" name="status" class="form-select"><option value="">Current employees</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${selectedStatus == item}"></option></select></div>
        <div class="col-md-3 col-lg-2"><button class="btn btn-outline-secondary w-100" type="submit"><i class="bi bi-search me-1"></i> Filter</button></div>
    </form>
    <div class="table-responsive">
        <table class="table align-middle bg-white">
            <thead><tr><th>Code</th><th>Employee</th><th>Department</th><th>Position</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="employee : ${employees.content}">
                <td class="fw-semibold" th:text="${employee.code}"></td>
                <td><a class="text-decoration-none fw-semibold" th:href="@{/employees/{id}(id=${employee.id})}" th:text="${employee.fullName}"></a><small class="d-block text-secondary" th:text="${employee.email}"></small></td>
                <td th:text="${employee.department.name}"></td><td th:text="${employee.position.name}"></td>
                <td><span class="status-tag" th:text="${employee.status}"></span></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/employees/{id}(id=${employee.id})}" aria-label="View employee" title="View"><i class="bi bi-arrow-up-right"></i></a></td>
            </tr>
            <tr th:if="${employees.empty}"><td colspan="6" class="text-center text-secondary py-5">No employees match these filters.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${employees.totalPages > 1}" aria-label="Employee pages" class="d-flex justify-content-between align-items-center mt-3">
        <span class="small text-secondary" th:text="|Page ${employees.number + 1} of ${employees.totalPages}|">Page</span>
        <div class="btn-group">
            <a class="btn btn-sm btn-outline-secondary" th:if="${employees.hasPrevious()}" th:href="@{/employees(page=${employees.number - 1},q=${q},department=${selectedDepartment},position=${selectedPosition},status=${selectedStatus})}">Previous</a>
            <a class="btn btn-sm btn-outline-secondary" th:if="${employees.hasNext()}" th:href="@{/employees(page=${employees.number + 1},q=${q},department=${selectedDepartment},position=${selectedPosition},status=${selectedStatus})}">Next</a>
        </div>
    </nav>
</main>
</body>
</html>
