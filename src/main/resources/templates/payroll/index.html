<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Payroll</title></head>
<body>
<main layout:fragment="content">
    <div class="page-heading"><div><p class="eyebrow">COMPENSATION</p><h1>Payroll</h1><p class="text-secondary">Create periods, generate payslips, and track payment status.</p></div></div>
    <section class="form-surface mb-4"><h2>Create payroll period</h2>
        <form th:action="@{/payroll}" th:object="${periodForm}" method="post" class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label">Month *</label><input class="form-control" th:field="*{month}" type="number" min="1" max="12" required></div>
            <div class="col-md-3"><label class="form-label">Year *</label><input class="form-control" th:field="*{year}" type="number" min="2000" required></div>
            <div class="col-md-3"><button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg me-1"></i> Create period</button></div>
        </form>
    </section>
    <section class="form-surface"><h2>Payroll periods</h2>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Period</th><th>Status</th><th>Payslips</th><th>Total net salary</th><th></th></tr></thead><tbody>
            <tr th:each="summary : ${periods}"><td class="fw-semibold" th:text="|${summary.period.month}/${summary.period.year}|"></td><td><span class="status-tag" th:text="${summary.period.status}"></span></td><td th:text="${summary.payslipCount}"></td><td th:text="${#numbers.formatDecimal(summary.totalNet, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/payroll/{id}(id=${summary.period.id})}" aria-label="Open period" title="Open"><i class="bi bi-arrow-up-right"></i></a></td></tr>
            <tr th:if="${periods.empty}"><td colspan="5" class="text-secondary">No payroll periods yet.</td></tr>
        </tbody></table></div>
    </section>
</main>
</body>
</html>
