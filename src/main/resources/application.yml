spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hrm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ha_Noi
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ha_Noi
  thymeleaf:
    cache: false
server:
  port: 8080